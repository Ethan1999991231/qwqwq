<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link href="style/style-main.css?v=20260423-uiverse-1" rel="stylesheet">
    <title>EarthMC 信息查询 - 管理</title>
    <style>
        .page-admin #mainArea {
            border-radius: 36px;
        }

        #adminGate h2,
        .adminBar h2 {
            font-family: var(--display-font);
            font-size: 1.35rem;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        #adminGate .hint {
            margin-top: 0.6rem;
            color: var(--text-muted);
            font-size: 0.92rem;
        }

        #adminForm {
            margin-top: 1.1rem;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            max-width: 420px;
        }

        #adminForm label {
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .adminRow {
            display: flex;
            gap: 0.5rem;
        }

        #adminPassword {
            flex: 1 1 auto;
            min-width: 0;
            padding: 0.65rem 0.9rem;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-strong);
            background: #fff;
            font: inherit;
            font-size: 0.95rem;
            color: var(--text);
        }

        #adminPassword:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .adminBtn {
            width: auto;
            padding: 0.6rem 1.15rem;
            border-radius: var(--radius-full);
            border: 1px solid rgba(37, 99, 235, 0.35);
            background: linear-gradient(135deg, var(--primary), var(--primary-strong));
            color: #fff;
            font: inherit;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.22);
            transition: transform var(--transition), box-shadow var(--transition);
        }

        .adminBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(37, 99, 235, 0.26);
        }

        .adminBtn.ghost {
            background: rgba(255, 255, 255, 0.92);
            color: var(--primary-strong);
            border-color: rgba(37, 99, 235, 0.28);
            box-shadow: none;
        }

        #adminStatus {
            min-height: 1.4rem;
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        #adminStatus.err {
            color: #b91c1c;
        }

        #adminStatus.ok {
            color: var(--secondary);
        }

        .adminBar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.75rem;
            padding-bottom: 0.9rem;
            border-bottom: 1px solid rgba(37, 99, 235, 0.14);
        }

        .adminActions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        #adminUpdated {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .adminGrid {
            display: grid;
            gap: 1rem;
            margin-top: 1.1rem;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .adminCard {
            padding: 1.1rem 1.2rem;
            border-radius: var(--radius-lg);
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(37, 99, 235, 0.14);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        }

        .adminCard h3 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            font-family: var(--display-font);
            font-size: 1rem;
            letter-spacing: -0.01em;
            color: var(--text);
        }

        .adminCard dl {
            margin-top: 0.75rem;
            display: grid;
            grid-template-columns: minmax(80px, auto) 1fr;
            gap: 0.42rem 0.85rem;
            font-size: 0.88rem;
        }

        .adminCard dt {
            color: var(--text-muted);
            font-weight: 700;
        }

        .adminCard dd {
            color: var(--text);
            font-weight: 700;
            word-break: break-word;
        }

        .badge {
            padding: 0.15rem 0.6rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            color: var(--text-muted);
            background: rgba(148, 163, 184, 0.18);
        }

        .badge.ok {
            color: #0f766e;
            background: rgba(15, 118, 110, 0.12);
        }

        .badge.warn {
            color: #b45309;
            background: rgba(180, 83, 9, 0.12);
        }

        .badge.err {
            color: #b91c1c;
            background: rgba(185, 28, 28, 0.12);
        }

        @media (max-width: 768px) {
            .adminRow {
                flex-direction: column;
            }

            .adminBtn {
                width: 100%;
            }
        }
    </style>
</head>
<body class="page-admin">
    <header id="pageHeader">
        <h1>EarthMC 信息查询</h1>
    </header>
    <nav id="mainNav">
        <a href="index.html">首页</a>
        <a href="players.html">玩家查询</a>
        <a href="towns.html">城镇查询</a>
        <a href="nations.html">国家查询</a>
        <a href="about.html">关于</a>
    </nav>
    <main id="mainArea">
        <section id="adminGate">
            <h2>管理员验证</h2>
            <p class="hint">这页不在导航里，知道地址才进得来。口令只在本页校验，不写入网站、不发送到别处。</p>
            <form id="adminForm" autocomplete="off">
                <label for="adminPassword">口令</label>
                <div class="adminRow">
                    <input id="adminPassword" type="password" autocomplete="off" spellcheck="false" placeholder="输入管理员口令" required>
                    <button class="adminBtn" id="adminSubmit" type="submit">进入</button>
                </div>
                <p id="adminStatus" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section id="adminPanel" hidden>
            <div class="adminBar">
                <h2>站点状态</h2>
                <div class="adminActions">
                    <span id="adminUpdated"></span>
                    <button class="adminBtn ghost" id="adminRefresh" type="button">刷新</button>
                    <button class="adminBtn ghost" id="adminLogout" type="button">退出</button>
                </div>
            </div>

            <div class="adminGrid">
                <article class="adminCard" id="cardServer">
                    <h3>服务器状态 <span class="badge" id="serverBadge">…</span></h3>
                    <dl id="serverList"></dl>
                </article>

                <article class="adminCard" id="cardNode">
                    <h3>节点状态 <span class="badge" id="nodeBadge">…</span></h3>
                    <dl id="nodeList"></dl>
                </article>

                <article class="adminCard" id="cardStorage">
                    <h3>存储 <span class="badge" id="storageBadge">…</span></h3>
                    <dl id="storageList"></dl>
                </article>
            </div>
        </section>
    </main>
    <footer>
        <p>by Ethan</p>
    </footer>
    <script src="javascript/js-admin.js?v=20261121-1"></script>
    <script src="javascript/effects.js?v=20260423-uiverse-1"></script>
</body>
</html>
