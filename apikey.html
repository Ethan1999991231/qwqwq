<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style/style-main.css?v=20260423-uiverse-1" rel="stylesheet">
    <link href="style/style-apikey.css?v=20261120-1" rel="stylesheet">
    <title>EarthMC 信息查询 - 填写 API Key</title>
</head>
<body class="page-apikey">
    <header id="pageHeader">
        <h1>EarthMC 信息查询</h1>
    </header>
    <nav id="mainNav">
        <a href="index.html">首页</a>
        <a href="players.html">玩家查询</a>
        <a href="towns.html">城镇查询</a>
        <a href="nations.html">国家查询</a>
        <a href="about.html">关于</a>
    </nav>
    <main id="mainArea">
        <section id="keyCard">
            <h2>先填一下你的 EarthMC API Key</h2>
            <p>EarthMC 现在要求每个查询请求都带上玩家自己的 API Key，没有它请求会直接返回 401。</p>
            <p>Key 在游戏内获取，说明见 <a class="inline" href="https://api.earthmc.net/" target="_blank" rel="noopener">api.earthmc.net</a>。</p>
            <form id="keyForm" autocomplete="off">
                <label class="keyLabel" for="apiKeyInput">API Key</label>
                <div class="keyInputWrap">
                    <input id="apiKeyInput" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴你的 API Key" required>
                    <button id="keyToggle" class="ghostBtn" type="button">显示</button>
                </div>
                <button id="keySubmit" class="keyBtn" type="submit">验证并进入</button>
                <p id="keyStatus" role="status" aria-live="polite"></p>
            </form>
            <p class="keyNote">Key 只存在这次访问的标签页里：关掉标签页就自动清除，不写入网站、不放进网址。站内换页不用重新输入。</p>
        </section>
    </main>
    <footer>
        <p>by Ethan</p>
    </footer>
    <script src="javascript/js-apikey.js?v=20261120-2"></script>
    <script src="javascript/effects.js?v=20260423-uiverse-1"></script>
</body>
</html>
