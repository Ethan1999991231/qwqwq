worker_processes  1;
pid logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;

    server {
        listen       80;
        server_name  localhost;

        location / {
            root   .;
            index  index.html;
            try_files $uri $uri/ =404;
        }

        location /api/ {
            set $earthmc_host api.earthmc.net;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass https://$earthmc_host$uri$is_args$args;

            proxy_ssl_server_name on;
            proxy_set_header Host api.earthmc.net;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Content-Type, Authorization";
                add_header Content-Length 0;
                return 204;
            }
        }

        location ~ "^/avatar/([a-fA-F0-9]{32})$" {
            set $avatar_id $1;
            set $avatar_host mc-heads.net;
            proxy_pass https://$avatar_host/avatar/$avatar_id/128;
            proxy_ssl_server_name on;
            proxy_ssl_name $avatar_host;
            proxy_set_header Host $avatar_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            add_header Cache-Control "public, max-age=600";
        }

        location ~ "^/avatar-backup/([a-fA-F0-9]{32})$" {
            set $avatar_id $1;
            set $avatar_host minotar.net;
            proxy_pass https://$avatar_host/helm/$avatar_id/128.png;
            proxy_ssl_server_name on;
            proxy_ssl_name $avatar_host;
            proxy_set_header Host $avatar_host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            add_header Cache-Control "public, max-age=600";
        }

        location ~ "(^/\.|^/(logs|temp|tools|tests|docs)/|\.(conf|bat|md|txt|ini)$)" {
            return 404;
        }

        error_log  logs/nginx-error.log;
        access_log logs/nginx-access.log;
    }
}
