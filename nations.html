<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style/style-search.css?v=20260423-uiverse-1" rel="stylesheet">
    <title>EarthMC 信息查询 - 国家查询</title>
</head>
<body class="page-search">
    <header id="pageHeader">
        <h1>EarthMC 信息查询</h1>
    </header>
    <nav id="mainNav">
        <a href="index.html">首页</a>
        <a href="players.html">玩家查询</a>
        <a href="towns.html">城镇查询</a>
        <a id="selected" href="nations.html">国家查询</a>
        <a href="about.html">关于</a>
    </nav>
    <main>
        <section id="mainArea" aria-label="国家搜索面板">
            <nav id="searchNav">
                <button id="listAll" type="button" onclick="searchAll()">获取全部国家列表</button>
                <input id="nationName" type="text" placeholder="输入国家名称或 UUID" autocomplete="off" aria-label="国家名称或 UUID">
                <button id="searchButton" type="button" onclick="search()">查询国家详情</button>
            </nav>
            <div class="table-card">
                <table id="nationList">
                    <thead>
                        <tr>
                            <th>国家名称</th>
                            <th>国家 UUID</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
    <footer>
        <p>by Ethan</p>
    </footer>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <p class="loading-text">正在查询国家列表...</p>
    </div>

    <script src="javascript/js-nations.js?v=20260422-2"></script>
    <script src="javascript/effects.js?v=20260423-uiverse-1"></script>
</body>
</html>
